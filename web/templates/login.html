<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main>
        <h1>Login</h1>

        {{ if .Error }}
            <p>{{ .Error }}</p>
        {{ end }}

        <form action="/login" method="post">
            <label>
                Email
                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </label>

            <label>
                Password
                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
